name: Weekly Security Audit

on:
  schedule:
    - cron: '0 0 * * 2'  # Every Tuesday at 00:00 UTC

jobs:
  audit:
    name: Audit
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write
    steps:
      - uses: actions/checkout@v5
      - uses: actions-rust-lang/audit@v1
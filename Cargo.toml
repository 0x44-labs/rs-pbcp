[package]
name = "pbcp"
version = "0.1.0"
description = """
A protocol for producing claims whose assertion is backed by proof of
resources spent.
"""
authors = ["Determination Labs Team"]
license = "MIT"
documentation = "https://docs.rs/pbcp"
homepage = "https://github.com/0x44-labs/rs-pbcp"
repository = "https://github.com/0x44-labs/rs-pbcp"
keywords = ["pow", "proof-of-work", "claims", "challenge", "protocol"]
categories = ["cryptography"]
readme = "README.md"
include = ["src/**/*", "README.md", "LICENSE"]
edition = "2024"
rust-version = "1.85.1"

[features]
default = []
zeroize = ["dep:zeroize", "blake3/zeroize", "traversev/zeroize"]

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
ciborium = "0.2.2"
http = "1.5.0"
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
serde_qs = "1.1.3"
subtle = "2.6.1"
traversev = "0.2.0"
ulid = { version = "3.0.0", features = ["serde"] }
zeroize = { version = "1.9.0", optional = true }

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "forbid"
unsafe_code = "forbid"

[package]
name = "pbcp"
version = "0.1.0"
edition = "2024"

[features]
default = []
zeroize = ["dep:zeroize", "blake3/zeroize", "traversev/zeroize"]

[dependencies]
base64 = "0.23.1"
blake3 = "1.8.7"
http = "1.5.0"
num-traits = "0.2.19"
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.151"
serde_json_canonicalizer = "0.3.2"
serde_qs = "1.1.3"
traversev = "0.2.0"
ulid = { version = "3.0.0", features = ["serde"] }
zeroize = { version = "1.9.0", optional = true }

[lints.rust]
missing_debug_implementations = "warn"
missing_docs = "warn"
unreachable_pub = "forbid"
unsafe_code = "forbid"
